<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="app-git-sha" content="__APP_GIT_SHA__">
  <link rel="manifest" href="/static/manifest.json?v=__APP_GIT_SHA__">
  <link rel="stylesheet" href="/static/styles.css?v=__APP_GIT_SHA__">
  <title>photo3x4</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><span class="logo-mark">▦</span><strong>photo3x4</strong><span class="local-pill">local</span></header>
    <section class="screen" id="home-screen">
      <div class="intro"><p class="eyebrow">Foto pronta em poucos toques</p><h1>Seu 3x4,<br><em>sem complicação.</em></h1><p class="muted">Fundo branco e enquadramento automático, direto no seu dispositivo.</p></div>
      <div class="home-art" aria-hidden="true"><span>3×4</span></div>
      <div class="action-stack"><button class="button primary" id="camera-button">⌾ <span>Tirar foto</span></button><button class="button secondary" id="gallery-button">▧ <span>Escolher da galeria</span></button></div>
      <input id="gallery-input" type="file" accept="image/*" hidden>
    </section>
    <section class="screen editor hidden" id="editor-screen">
      <div class="editor-heading"><button class="icon-button" id="back-button" aria-label="Voltar">‹</button><div class="editor-brand"><span class="logo-mark">▦</span><strong>photo3x4</strong></div><div class="editor-context"><p class="eyebrow">Ajuste final</p><h2>Sua foto 3x4</h2></div></div>
      <div class="preview-card"><canvas id="preview" aria-label="Prévia da foto 3x4"></canvas><div class="processing hidden" id="processing"><span class="spinner"></span><span>Removendo o fundo…</span></div></div>
      <div class="controls"><label for="zoom">Zoom <output id="zoom-value">100%</output></label><div class="zoom-control-row"><input id="zoom" type="range" min="100" max="180" value="100"><button class="small-button" data-move="center" aria-label="Recentralizar imagem">⊙</button></div></div>
      <p class="hint">Arraste a imagem no quadro ou recentralize.</p>
      <div class="bottom-actions"><button class="button secondary" id="redo-button">‹ &nbsp;Voltar</button><button class="button primary" id="save-button">↓ &nbsp;Salvar</button></div>
    </section>
    <p class="error hidden" id="error" role="alert"></p>
    <div class="save-modal hidden" id="save-modal" role="dialog" aria-modal="true" aria-labelledby="save-modal-title"><div class="save-dialog"><button class="save-close" id="close-save-modal" aria-label="Fechar">×</button><p class="eyebrow">Exportar</p><h2 id="save-modal-title">Como deseja salvar?</h2><button class="button primary" id="save-photo-modal">↓ &nbsp;Salvar foto 3x4</button><button class="button secondary" id="save-sheet-modal">▤ &nbsp;Salvar folha 10×15</button></div></div>
  </main>
  <script src="/static/app.js?v=__APP_GIT_SHA__" type="module"></script>
</body>
</html>
